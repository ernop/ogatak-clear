name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Syntax check
        run: for f in src/*.js src/modules/*.js; do node --check "$f"; done
      - name: Pure-logic tests
        run: for t in src/modules/*.test.js; do node "$t"; done
